name: FyzzXYZZY SDK CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Godot version and bindings revision live in godot/dependency.json.
# Cache identity follows that manifest, cmake/GodotDependency.cmake and
# the compiler toolchain; unrelated SDK CMake edits do not rebuild bindings.
jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Record Ubuntu release for package-cache isolation
        id: ubuntu_release
        shell: bash
        run: |
          . /etc/os-release
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Identify resolved Ubuntu package revisions
        id: apt_revision
        shell: bash
        run: echo "revision=$(bash .github/scripts/install-vulkan.sh --cache-revision)" >> "$GITHUB_OUTPUT"
      - name: Restore cached Ubuntu Vulkan packages
        id: apt_debs
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/vulkan-apt/archives
          key: fyzzxyzzy-apt-debs-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu_release.outputs.version }}-${{ steps.apt_revision.outputs.revision }}
          restore-keys: |
            fyzzxyzzy-apt-debs-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu_release.outputs.version }}-
            fyzzxyzzy-apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu_release.outputs.version }}-
      - name: Install Vulkan development packages
        run: bash .github/scripts/install-vulkan.sh
      - name: Identify completed Ubuntu package archives
        id: apt_archive_state
        shell: bash
        run: |
          if find .ci-cache/vulkan-apt/archives -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save cached Ubuntu Vulkan packages
        if: steps.apt_debs.outputs.cache-hit != 'true' && steps.apt_archive_state.outputs.available == 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache/vulkan-apt/archives
          key: ${{ steps.apt_debs.outputs.cache-primary-key }}
      - name: Install DXC for shared PhysX HLSL to SPIR-V
        shell: bash
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/linux_dxc_2026_02_20.x86_64.tar.gz" \
            -o "${RUNNER_TEMP}/linux-dxc.tar.gz"
          mkdir -p "${RUNNER_TEMP}/dxc"
          tar -xzf "${RUNNER_TEMP}/linux-dxc.tar.gz" -C "${RUNNER_TEMP}/dxc"
          test -x "${RUNNER_TEMP}/dxc/bin/dxc"
          echo "${RUNNER_TEMP}/dxc/bin" >> "${GITHUB_PATH}"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/dxc/lib" >> "${GITHUB_ENV}"
      - name: Record compiler for compiled dependency cache
        id: cache_toolchain
        shell: bash
        run: |
          . /etc/os-release
          echo "toolchain=ubuntu-${VERSION_ID}-gcc-$(c++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled godot-cpp
        id: godot_cpp_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/_deps/fyzzxyzzy_godot_cpp-src
            build/_deps/fyzzxyzzy_godot_cpp-build
            build/_deps/fyzzxyzzy_godot_cpp-subbuild
            build/bin/libgodot-cpp.linux.template_debug.x86_64.a
            build/.ninja_deps
            build/.ninja_log
          key: godotcpp-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_toolchain.outputs.toolchain }}-${{ hashFiles('godot/dependency.json', 'cmake/GodotDependency.cmake') }}-template_debug-Release
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFYZZXYZZY_BUILD_GODOT=ON -DFYZZXYZZY_STRICT_RIGID_FRICTION_CONFORMANCE=ON -DFYZZXYZZY_BUILD_VULKAN=ON -DFYZZXYZZY_BUILD_PHYSX_GPU_AABB_TEST=ON -DFYZZXYZZY_ENABLE_GPU_PHYSICS_PROTOTYPES=ON
      - name: Verify SDK C++23 compiler and standard library
        run: |
          cmake --build build --target fyzzxyzzy_cpp23_contract --parallel 2
          ctest --test-dir build -R '^fyzzxyzzy_cpp23_contract$' --output-on-failure
      - name: Validate shared PhysX HLSL to SPIR-V before full SDK build
        shell: bash
        run: |
          cmake --build build --target fyzzxyzzy_native_multi_resource fyzzxyzzy_physx_aabb_encoding fyzzxyzzy_physx_cuda_aabb_launch fyzzxyzzy_physx_source_descriptor fyzzxyzzy_physx_source_overlap_native fyzzxyzzy_physx_source_scan_native fyzzxyzzy_physx_source_pairs_native fyzzxyzzy_physx_source_sequence_native fyzzxyzzy_physx_source_d32_fill_native fyzzxyzzy_physx_source_region_create_native fyzzxyzzy_physx_source_region_histograms_native fyzzxyzzy_physx_source_clear_new_flags_native fyzzxyzzy_physx_source_sapbox_indices_native fyzzxyzzy_physx_source_sap_removed_native fyzzxyzzy_physx_source_sap_updated_native fyzzxyzzy_physx_mark_removed_arena fyzzxyzzy_physx_removed_projections fyzzxyzzy_physx_created_pairs fyzzxyzzy_physx_radix_count fyzzxyzzy_physx_radix_scatter fyzzxyzzy_physx_sap_box_indices fyzzxyzzy_physx_sap_ranked_sort fyzzxyzzy_physx_sap_endpoint_histogram fyzzxyzzy_physx_sap_incremental_comparisons fyzzxyzzy_physx_sap_incremental_pairs fyzzxyzzy_physx_sap_clear_new_flags fyzzxyzzy_physx_bp_copy_reports fyzzxyzzy_physx_bp_report_classification fyzzxyzzy_physx_sap_region_producer fyzzxyzzy_physx_sap_region_histograms fyzzxyzzy_physx_sap_active_region_lists fyzzxyzzy_sap_overlap_work fyzzxyzzy_sap_overlap_prefix fyzzxyzzy_sap_newbounds_pairs fyzzxyzzy_sap_newbounds_sequence fyzzxyzzy_physx_broadphase_completion --parallel 4
          ctest --test-dir build -R '^fyzzxyzzy_physx_(aabb_encoding|cuda_aabb_launch|source_descriptor|source_overlap_native|source_scan_native|source_pairs_native|source_sequence_native|source_d32_fill_native|source_region_create_native|source_region_histograms_native|source_clear_new_flags_native|source_sapbox_indices_native|source_sap_removed_native|source_sap_updated_native|ten_operation_chain|mark_removed_arena|removed_projections|created_pairs|radix_count|radix_scatter|sap_box_indices|sap_ranked_sort|sap_endpoint_histogram|sap_incremental_comparisons|sap_incremental_pairs|sap_clear_new_flags|bp_copy_reports|bp_report_classification|sap_region_producer|sap_region_histograms|sap_active_region_lists|broadphase_completion)$' --output-on-failure
          ctest --test-dir build -R '^fyzzxyzzy_sap_(overlap_(work|prefix)|newbounds_(pairs|sequence))$' --output-on-failure
          ctest --test-dir build -R '^fyzzxyzzy_native_multi_resource$' --output-on-failure
      - name: Build
        run: cmake --build build --target fyzzxyzzy_native_scene_smoke fyzzxyzzy_headless_smoke fyzzxyzzy_physx_cuda_address_test fyzzxyzzy_godot fyzzxyzzy_vulkan_memory_smoke fyzzxyzzy_physx_cuda_host_transfer fyzzxyzzy_physx_sap_broadphase_descriptor_native fyzzxyzzy_physx_cuda_aabb_launch fyzzxyzzy_vulkan_dispatch_smoke fyzzxyzzy_physx_aabb_encoding fyzzxyzzy_vulkan_floor_physics fyzzxyzzy_vulkan_world_smoke --parallel 4
      - name: Validate reusable godot-cpp outputs
        shell: bash
        run: |
          test -s build/bin/libgodot-cpp.linux.template_debug.x86_64.a
          test -d build/_deps/fyzzxyzzy_godot_cpp-src/.git
          test -d build/_deps/fyzzxyzzy_godot_cpp-subbuild
          test -s build/.ninja_deps
          test -s build/.ninja_log
          test -d build/_deps/fyzzxyzzy_godot_cpp-build/gen/include/godot_cpp
          find build/_deps/fyzzxyzzy_godot_cpp-build -type f -name '*.o' -print -quit | grep -q .
      - name: Cache compiled godot-cpp
        if: steps.godot_cpp_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/_deps/fyzzxyzzy_godot_cpp-src
            build/_deps/fyzzxyzzy_godot_cpp-build
            build/_deps/fyzzxyzzy_godot_cpp-subbuild
            build/bin/libgodot-cpp.linux.template_debug.x86_64.a
            build/.ninja_deps
            build/.ninja_log
          key: ${{ steps.godot_cpp_cache.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Prove strict 48-frame coupled PGS conformance
        run: ctest --test-dir build -R '^fyzzxyzzy_headless_smoke$' --verbose --output-on-failure
      - name: Measure native serial/concurrent third-pass scheduler
        if: github.event_name == 'workflow_dispatch'
        run: |
          cmake --build build --target fyzzxyzzy_native_third_pass_benchmark --parallel 2
          ./build/fyzzxyzzy_native_third_pass_benchmark
      - name: Offline CPU source distribution
        shell: bash
        run: |
          cmake --build build --target fyzzxyzzy_source_bundle
          mkdir -p "${RUNNER_TEMP}/fyzzxyzzy-source-check"
          cd "${RUNNER_TEMP}/fyzzxyzzy-source-check"
          cmake -E tar xzf "${GITHUB_WORKSPACE}/build/fyzzxyzzy-source.tar.gz"
          test -f FyzzXYZZY-SDK/vendor/PhysX/LICENSE.md
          test -f FyzzXYZZY-SDK/vendor/PhysX/physx/LICENSE.md
          test -f FyzzXYZZY-SDK/vendor/PhysX/physx/CMakeLists.txt
          cmake -S FyzzXYZZY-SDK -B offline-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFYZZXYZZY_BUILD_GODOT=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          grep -F "vendor/PhysX" offline-build/CMakeCache.txt
          cmake --build offline-build --target fyzzxyzzy_cpp23_contract fyzzxyzzy_native_scene_smoke fyzzxyzzy_headless_smoke fyzzxyzzy_physx_cuda_address_test --parallel 4
          ctest --test-dir offline-build --output-on-failure
          # Production/distribution configurations must also reject toolchains
          # lacking C++23 std::expected when BUILD_TESTING=OFF.
          cmake -S FyzzXYZZY-SDK -B offline-production -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DFYZZXYZZY_BUILD_GODOT=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON

      - name: Godot headless acceptance
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("godot/dependency.json"))["engine_version"])')"
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip" -o "${RUNNER_TEMP}/godot.zip"
          mkdir -p "${RUNNER_TEMP}/godot-bin"
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot-bin"
          engine="${RUNNER_TEMP}/godot-bin/Godot_v${version}-stable_linux.x86_64"
          chmod +x "$engine"
          echo "FYZZXYZZY_GODOT_ENGINE=$engine" >> "$GITHUB_ENV"
          # Exercise the runtime GDExtension contract directly. Editor import is
          # an independent integration test and must not gate the headless SDK test.
          set +e
          "$engine" --headless --verbose --path godot/test_project --script res://tests/headless_smoke.gd 2>&1 | tee "${RUNNER_TEMP}/fyzzxyzzy-godot.log"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if command -v gdb >/dev/null 2>&1; then
              gdb --batch -ex "set pagination off" -ex run -ex "thread apply all bt 12" --args \
                "$engine" --headless --path godot/test_project --script res://tests/headless_smoke.gd || true
            fi
            exit "$status"
          fi
          grep -Fq "FyzzXYZZY Godot acceptance PASS" "${RUNNER_TEMP}/fyzzxyzzy-godot.log"

      - name: Godot editor import acceptance
        shell: bash
        run: |
          engine="$FYZZXYZZY_GODOT_ENGINE"
          project="${RUNNER_TEMP}/fyzzxyzzy-editor-acceptance"
          cp -a godot/test_project "$project"
          rm -rf "$project/.godot"

          # Populate the extension registry before the first normal headless
          # editor session; the acceptance editor needs registered native classes.
          timeout 45s "$engine" --headless --recovery-mode --editor --import --path "$project"
          test -s "$project/.godot/extension_list.cfg"

          # Verify the ordinary editor import works on the prepared project.
          timeout 45s "$engine" --headless --editor --import --path "$project"

          # Verify runtime class registration after both editor passes.
          timeout 45s "$engine" --headless --path "$project" --script res://tests/headless_smoke.gd \
            2>&1 | tee "${RUNNER_TEMP}/fyzzxyzzy-editor-runtime.log"
          grep -Fq "FyzzXYZZY Godot acceptance PASS" "${RUNNER_TEMP}/fyzzxyzzy-editor-runtime.log"
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Find Windows SDK DXC
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $candidates = @(Get-ChildItem -Path $sdkBin -Filter dxc.exe -File -Recurse |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
              Sort-Object FullName -Descending)
          if ($candidates.Count -eq 0) { throw 'Windows SDK DXC compiler not found' }
          "FYZZXYZZY_DXC=$($candidates[0].FullName)" >> $env:GITHUB_ENV
      - name: Record compiler for compiled dependency cache
        id: cache_toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'MSVC cache identity requires vswhere' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC installation not found' }
          $toolset = Get-ChildItem -Path (Join-Path $installation 'VC\Tools\MSVC') -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolset) { throw 'MSVC toolset version not found' }
          # SDK headers and CRT also contribute to compiled godot-cpp objects.
          # Roll the cache when the Windows SDK changes, not for unrelated
          # hosted-runner image patch updates.
          $sdkIncludes = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersion = Get-ChildItem -Path $sdkIncludes -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVersion) { throw 'Windows SDK include version not found' }
          "toolchain=$($env:ImageOS)-msvc-$($toolset.Name)-sdk-$($sdkVersion.Name)" >> $env:GITHUB_OUTPUT
      - name: Restore compiled godot-cpp
        id: godot_cpp_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/_deps/fyzzxyzzy_godot_cpp-src
            build/_deps/fyzzxyzzy_godot_cpp-build
            build/_deps/fyzzxyzzy_godot_cpp-subbuild
            build/bin/libgodot-cpp.windows.template_debug.x86_64.lib
          key: godotcpp-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_toolchain.outputs.toolchain }}-${{ hashFiles('godot/dependency.json', 'cmake/GodotDependency.cmake') }}-template_debug-Release
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DFYZZXYZZY_BUILD_GODOT=ON -DFYZZXYZZY_STRICT_RIGID_FRICTION_CONFORMANCE=ON -DFYZZXYZZY_BUILD_D3D12=ON -DFYZZXYZZY_BUILD_D3D12_AABB_TEST=ON "-DFYZZXYZZY_DXC=$env:FYZZXYZZY_DXC"
      - name: Verify SDK C++23 compiler and standard library
        shell: pwsh
        run: |
          cmake --build build --config Release --target fyzzxyzzy_cpp23_contract --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -R '^fyzzxyzzy_cpp23_contract$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute native D3D12 PhysX AABB conformance (WARP)
        shell: pwsh
        env:
          FYZZXYZZY_D3D12_FORCE_WARP: '1'
        run: |
          cmake --build build --config Release --target fyzzxyzzy_native_multi_resource_d3d12 fyzzxyzzy_physx_aabb_encoding_d3d12 fyzzxyzzy_physx_cuda_aabb_launch_d3d12 fyzzxyzzy_physx_source_descriptor_d3d12 fyzzxyzzy_physx_source_overlap_native_d3d12 fyzzxyzzy_physx_source_scan_native_d3d12 fyzzxyzzy_physx_source_pairs_native_d3d12 fyzzxyzzy_physx_source_sequence_native_d3d12 fyzzxyzzy_physx_source_d32_fill_native_d3d12 fyzzxyzzy_physx_source_region_create_native_d3d12 fyzzxyzzy_physx_source_region_histograms_native_d3d12 fyzzxyzzy_physx_source_clear_new_flags_native_d3d12 fyzzxyzzy_physx_source_sapbox_indices_native_d3d12 fyzzxyzzy_physx_source_sap_removed_native_d3d12 fyzzxyzzy_physx_source_sap_updated_native_d3d12 fyzzxyzzy_physx_mark_removed_arena_d3d12 fyzzxyzzy_physx_removed_projections_d3d12 fyzzxyzzy_physx_created_pairs_d3d12 fyzzxyzzy_physx_radix_count_d3d12 fyzzxyzzy_physx_radix_scatter_d3d12 fyzzxyzzy_physx_sap_box_indices_d3d12 fyzzxyzzy_physx_sap_ranked_sort_d3d12 fyzzxyzzy_physx_sap_endpoint_histogram_d3d12 fyzzxyzzy_physx_sap_incremental_comparisons_d3d12 fyzzxyzzy_physx_sap_incremental_pairs_d3d12 fyzzxyzzy_physx_sap_clear_new_flags_d3d12 fyzzxyzzy_physx_bp_copy_reports_d3d12 fyzzxyzzy_physx_bp_report_classification_d3d12 fyzzxyzzy_physx_sap_region_producer_d3d12 fyzzxyzzy_physx_sap_region_histograms_d3d12 fyzzxyzzy_physx_sap_active_region_lists_d3d12 fyzzxyzzy_sap_overlap_work_d3d12 fyzzxyzzy_sap_overlap_prefix_d3d12 fyzzxyzzy_sap_newbounds_pairs_d3d12 fyzzxyzzy_sap_newbounds_sequence_d3d12 fyzzxyzzy_physx_broadphase_completion_d3d12 fyzzxyzzy_physx_cuda_host_transfer_d3d12 fyzzxyzzy_physx_sap_broadphase_descriptor_native_d3d12 --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -R '^fyzzxyzzy_physx_(aabb_encoding|cuda_aabb_launch|source_descriptor|source_overlap_native|source_scan_native|source_pairs_native|source_sequence_native|source_d32_fill_native|source_region_create_native|source_region_histograms_native|source_clear_new_flags_native|source_sapbox_indices_native|source_sap_removed_native|source_sap_updated_native|ten_operation_chain|mark_removed_arena|removed_projections|created_pairs|radix_count|radix_scatter|sap_box_indices|sap_ranked_sort|sap_endpoint_histogram|sap_incremental_comparisons|sap_incremental_pairs|sap_clear_new_flags|bp_copy_reports|bp_report_classification|sap_region_producer|sap_region_histograms|sap_active_region_lists|broadphase_completion|cuda_host_transfer|sap_broadphase_descriptor_native)_d3d12$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -R '^fyzzxyzzy_sap_(overlap_(work|prefix)|newbounds_(pairs|sequence))_d3d12$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -R '^fyzzxyzzy_native_multi_resource_d3d12$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build --config release --target fyzzxyzzy_native_scene_smoke fyzzxyzzy_headless_smoke fyzzxyzzy_physx_cuda_address_test fyzzxyzzy_godot --parallel 4
      - name: Validate reusable godot-cpp outputs
        shell: pwsh
        run: |
          $library = 'build/bin/libgodot-cpp.windows.template_debug.x86_64.lib'
          $buildDir = 'build/_deps/fyzzxyzzy_godot_cpp-build'
          if (-not (Test-Path $library) -or (Get-Item $library).Length -eq 0) { throw 'Missing compiled godot-cpp library' }
          if (-not (Test-Path 'build/_deps/fyzzxyzzy_godot_cpp-src/.git')) { throw 'Missing pinned godot-cpp source checkout' }
          if (-not (Test-Path 'build/_deps/fyzzxyzzy_godot_cpp-subbuild')) { throw 'Missing dependency population state' }
          if (-not (Test-Path "$buildDir/gen/include/godot_cpp")) { throw 'Missing generated bindings' }
          if (-not (Get-ChildItem -Path $buildDir -Filter '*.obj' -File -Recurse | Select-Object -First 1)) {
            throw 'Missing godot-cpp compilation intermediates'
          }
      - name: Cache compiled godot-cpp
        if: steps.godot_cpp_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/_deps/fyzzxyzzy_godot_cpp-src
            build/_deps/fyzzxyzzy_godot_cpp-build
            build/_deps/fyzzxyzzy_godot_cpp-subbuild
            build/bin/libgodot-cpp.windows.template_debug.x86_64.lib
          key: ${{ steps.godot_cpp_cache.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build -C release --output-on-failure
      - name: Prove strict 48-frame coupled PGS conformance
        run: ctest --test-dir build -C release -R '^fyzzxyzzy_headless_smoke$' --verbose --output-on-failure
      - name: Measure native serial/concurrent third-pass scheduler
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          cmake --build build --config Release --target fyzzxyzzy_native_third_pass_benchmark --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\Release\fyzzxyzzy_native_third_pass_benchmark.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Godot headless acceptance
        shell: pwsh
        run: |
          $version = (Get-Content 'godot/dependency.json' -Raw | ConvertFrom-Json).engine_version
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'godot-bin'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $bin
          $exe = Join-Path $bin "Godot_v$version-stable_win64_console.exe"
          if (-not (Test-Path $exe)) { throw "Godot console executable not found: $exe" }
          "FYZZXYZZY_GODOT_ENGINE=$exe" >> $env:GITHUB_ENV
          $godotOutput = & $exe --headless --path godot/test_project --script res://tests/headless_smoke.gd 2>&1
          $status = $LASTEXITCODE
          $godotOutput | ForEach-Object { Write-Output $_ }
          if ($status -ne 0) { exit $status }
          if (-not ($godotOutput -match 'FyzzXYZZY Godot acceptance PASS')) {
            throw "Godot acceptance completion marker missing"
          }
      - name: Godot editor import acceptance
        shell: pwsh
        run: |
          $exe = $env:FYZZXYZZY_GODOT_ENGINE
          $project = Join-Path $env:RUNNER_TEMP 'fyzzxyzzy-editor-acceptance'
          Copy-Item -Path 'godot/test_project' -Destination $project -Recurse
          $cache = Join-Path $project '.godot'
          if (Test-Path $cache) { Remove-Item -Path $cache -Force -Recurse }

          & $exe --headless --recovery-mode --editor --import --path $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $registry = Join-Path $cache 'extension_list.cfg'
          if (-not (Test-Path $registry)) { throw "Godot extension registry not generated" }

          & $exe --headless --editor --import --path $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $output = & $exe --headless --path $project --script res://tests/headless_smoke.gd 2>&1
          $status = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($status -ne 0) { exit $status }
          if (-not ($output -match 'FyzzXYZZY Godot acceptance PASS')) {
            throw "Godot editor acceptance runtime marker missing"
          }

  native-no-physx-linux:
    name: Independent SDK / Vulkan without PhysX
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Record Ubuntu release for package-cache isolation
        id: ubuntu_release
        shell: bash
        run: |
          . /etc/os-release
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Identify resolved Ubuntu package revisions
        id: apt_revision
        shell: bash
        run: echo "revision=$(bash .github/scripts/install-vulkan.sh --cache-revision)" >> "$GITHUB_OUTPUT"
      - name: Restore cached Ubuntu Vulkan packages
        id: apt_debs
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/vulkan-apt/archives
          key: fyzzxyzzy-apt-debs-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu_release.outputs.version }}-${{ steps.apt_revision.outputs.revision }}
          restore-keys: |
            fyzzxyzzy-apt-debs-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu_release.outputs.version }}-
            fyzzxyzzy-apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu_release.outputs.version }}-
      - name: Install Vulkan SDK
        run: bash .github/scripts/install-vulkan.sh
      - name: Identify completed Ubuntu package archives
        id: apt_archive_state
        shell: bash
        run: |
          if find .ci-cache/vulkan-apt/archives -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save cached Ubuntu Vulkan packages
        if: steps.apt_debs.outputs.cache-hit != 'true' && steps.apt_archive_state.outputs.available == 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache/vulkan-apt/archives
          key: ${{ steps.apt_debs.outputs.cache-primary-key }}
      - name: Configure without external source or network
        run: cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFYZZXYZZY_ENABLE_PHYSX_SOURCE=OFF -DFYZZXYZZY_BUILD_VULKAN=ON -DFYZZXYZZY_ENABLE_GPU_PHYSICS_PROTOTYPES=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build and test native core and compute
        shell: bash
        run: |
          cmake --build build-native --parallel 4
          ctest --test-dir build-native --output-on-failure
          test ! -d build-native/_deps/fyzzxyzzy_physx-src
          test -f build-native/libfyzzxyzzy_core.a
          test -f build-native/libfyzzxyzzy_compute.a

  native-no-physx-windows:
    name: Independent SDK / D3D12 without PhysX
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Configure without external source or network
        shell: pwsh
        run: cmake -S . -B build-native -A x64 -DBUILD_TESTING=ON -DFYZZXYZZY_ENABLE_PHYSX_SOURCE=OFF -DFYZZXYZZY_BUILD_D3D12=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build and test native core and compute
        shell: pwsh
        run: |
          cmake --build build-native --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-native -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'build-native/_deps/fyzzxyzzy_physx-src') { throw 'PhysX was fetched by native-only build' }
