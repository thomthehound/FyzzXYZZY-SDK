name: Native D3D12 submit phase profiling
on:
  push:
    branches:
      - ci/sap-d3d12-submit-phases-131
jobs:
  d3d12-source:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find Windows SDK DXC
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $compiler = Get-ChildItem -Path $sdkBin -Filter dxc.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'Windows SDK DXC not found' }
          "FYZZXYZZY_DXC=$($compiler.FullName)" >> $env:GITHUB_ENV
      - name: Configure D3D12 source GPU
        shell: pwsh
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DFYZZXYZZY_BUILD_GODOT=OFF -DFYZZXYZZY_BUILD_D3D12=ON -DFYZZXYZZY_BUILD_D3D12_AABB_TEST=ON "-DFYZZXYZZY_DXC=$env:FYZZXYZZY_DXC"
      - name: Build source radix conformance and profiling
        shell: pwsh
        run: cmake --build build --config Release --target fyzzxyzzy_physx_source_sap_radix_native_d3d12 --parallel 4
      - name: Verify original WR radix and profile D3D12 recording
        shell: pwsh
        env:
          FYZZXYZZY_D3D12_FORCE_WARP: '1'
          FYZZXYZZY_PROFILE_D3D12_SUBMIT: '1'
        run: |
          ctest --test-dir build -C Release -R fyzzxyzzy_physx_source_sap_radix_native_d3d12 --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target fyzzxyzzy_source_sap_radix_profile_alternating_d3d12 --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
