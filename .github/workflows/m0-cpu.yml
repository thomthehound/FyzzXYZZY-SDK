name: M0 CPU smoke

# Validate bootstrap changes on the M0 branch; allow manual reruns later.
on:
  push:
    branches:
      - feature/m0-headless-bootstrap
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --target fizzx_headless_smoke --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config release --target fizzx_headless_smoke --parallel 4
      - name: Test
        run: ctest --test-dir build -C release --output-on-failure
