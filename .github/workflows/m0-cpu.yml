name: M0 CPU and Godot acceptance

# Validate bootstrap changes on the M0 branch; allow manual reruns later.
on:
  push:
    branches:
      - feature/m0-headless-bootstrap
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFIZZX_BUILD_GODOT=ON
      - name: Build
        run: cmake --build build --target fizzx_headless_smoke fizzx_godot fizzx_godot_probe_empty fizzx_godot_probe_class --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Offline CPU source distribution
        shell: bash
        run: |
          cmake --build build --target fizzx_source_bundle
          mkdir -p "${RUNNER_TEMP}/fizzx-source-check"
          cd "${RUNNER_TEMP}/fizzx-source-check"
          cmake -E tar xzf "${GITHUB_WORKSPACE}/build/fizzx-sdk-m0-source.tar.gz"
          test -f FizzX-SDK/vendor/PhysX/LICENSE.md
          test -f FizzX-SDK/vendor/PhysX/physx/LICENSE.md
          test -f FizzX-SDK/vendor/PhysX/physx/CMakeLists.txt
          cmake -S FizzX-SDK -B offline-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFIZZX_BUILD_GODOT=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          grep -F "vendor/PhysX" offline-build/CMakeCache.txt
          cmake --build offline-build --target fizzx_headless_smoke --parallel 4
          ctest --test-dir offline-build --output-on-failure

      - name: Godot 4.7.2 headless acceptance
        shell: bash
        run: |
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "${RUNNER_TEMP}/godot.zip"
          mkdir -p "${RUNNER_TEMP}/godot-bin"
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot-bin"
          chmod +x "${RUNNER_TEMP}/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          engine="${RUNNER_TEMP}/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          # Exercise the runtime GDExtension contract directly. Editor import is
          # an independent integration test and must not gate the headless SDK test.
          set +e
          "$engine" --headless --verbose --path godot/test_project --script res://tests/headless_smoke.gd 2>&1 | tee "${RUNNER_TEMP}/fizzx-godot.log"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if command -v gdb >/dev/null 2>&1; then
              gdb --batch -ex "set pagination off" -ex run -ex "thread apply all bt 12" --args \
                "$engine" --headless --path godot/test_project --script res://tests/headless_smoke.gd || true
            fi
            exit "$status"
          fi
          grep -Fq "FizzX Godot M0 acceptance PASS" "${RUNNER_TEMP}/fizzx-godot.log"

      - name: Linux editor import diagnostic
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          engine="${RUNNER_TEMP}/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          control="${RUNNER_TEMP}/editor-control"
          without_extension="${RUNNER_TEMP}/editor-no-extension"
          empty_probe="${RUNNER_TEMP}/editor-empty-probe"
          class_probe="${RUNNER_TEMP}/editor-class-probe"
          full="${RUNNER_TEMP}/editor-full"

          mkdir -p "$control"
          printf 'config_version=5\n\n[application]\nconfig/name="Editor Control"\n\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$control/project.godot"
          for project in "$without_extension" "$empty_probe" "$class_probe" "$full"; do
            cp -a godot/test_project "$project"
            rm -rf "$project/.godot"
          done
          rm -f "$without_extension/addons/fizzx/fizzx.gdextension"
          cp build/fizzx_godot_probe_empty.so "$empty_probe/bin/fizzx_godot.so"
          cp build/fizzx_godot_probe_class.so "$class_probe/bin/fizzx_godot.so"

          set +e
          for scenario in control without_extension empty_probe class_probe full; do
            case "$scenario" in
              control) project="$control" ;;
              without_extension) project="$without_extension" ;;
              empty_probe) project="$empty_probe" ;;
              class_probe) project="$class_probe" ;;
              full) project="$full" ;;
            esac
            timeout 45s "$engine" --headless --editor --import --path "$project" > "${RUNNER_TEMP}/editor-${scenario}.log" 2>&1
            status=$?
            echo "EDITOR_IMPORT_RESULT scenario=$scenario exit=$status"
            cat "${RUNNER_TEMP}/editor-${scenario}.log"
            if [ "$scenario" = full ]; then full_status=$status; fi
          done
          set -e

          if [ "$full_status" -ne 0 ]; then
            if ! command -v gdb >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq gdb || true
            fi
            if command -v gdb >/dev/null 2>&1; then
              rm -rf "$full/.godot"
              timeout 75s gdb --batch -return-child-result \
                -ex "set pagination off" -ex run -ex "thread apply all bt 18" --args \
                "$engine" --headless --editor --import --path "$full" || true
            fi
          fi
          test "$full_status" -eq 0
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DFIZZX_BUILD_GODOT=ON
      - name: Build
        run: cmake --build build --config release --target fizzx_headless_smoke fizzx_godot --parallel 4
      - name: Test
        run: ctest --test-dir build -C release --output-on-failure
      - name: Godot 4.7.2 headless acceptance
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'godot-bin'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $bin
          $exe = Join-Path $bin 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path $exe)) { throw "Godot console executable not found: $exe" }
          $godotOutput = & $exe --headless --path godot/test_project --script res://tests/headless_smoke.gd 2>&1
          $status = $LASTEXITCODE
          $godotOutput | ForEach-Object { Write-Output $_ }
          if ($status -ne 0) { exit $status }
          if (-not ($godotOutput -match 'FizzX Godot M0 acceptance PASS')) {
            throw "Godot acceptance completion marker missing"
          }
