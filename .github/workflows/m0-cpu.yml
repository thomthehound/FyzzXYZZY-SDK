name: M0 CPU and Godot acceptance

# Validate bootstrap changes on the M0 branch; allow manual reruns later.
on:
  push:
    branches:
      - feature/m0-headless-bootstrap
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFIZZX_BUILD_GODOT=ON
      - name: Build
        run: cmake --build build --target fizzx_headless_smoke fizzx_godot --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Godot 4.7.2 headless acceptance
        shell: bash
        run: |
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "${RUNNER_TEMP}/godot.zip"
          mkdir -p "${RUNNER_TEMP}/godot-bin"
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot-bin"
          chmod +x "${RUNNER_TEMP}/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          engine="${RUNNER_TEMP}/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          # Exercise the runtime GDExtension contract directly. Editor import is
          # an independent integration test and must not gate the headless SDK test.
          set +e
          "$engine" --headless --verbose --path godot/test_project --script res://tests/headless_smoke.gd
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if command -v gdb >/dev/null 2>&1; then
              gdb --batch -ex "set pagination off" -ex run -ex "thread apply all bt 12" --args \
                "$engine" --headless --path godot/test_project --script res://tests/headless_smoke.gd || true
            fi
            exit "$status"
          fi

  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DFIZZX_BUILD_GODOT=ON
      - name: Build
        run: cmake --build build --config release --target fizzx_headless_smoke fizzx_godot --parallel 4
      - name: Test
        run: ctest --test-dir build -C release --output-on-failure
      - name: Godot 4.7.2 headless acceptance
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'godot-bin'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $bin
          $exe = Join-Path $bin 'Godot_v4.7.2-stable_win64.exe'
          & $exe --headless --editor --import --path godot/test_project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --headless --path godot/test_project --script res://tests/headless_smoke.gd
          exit $LASTEXITCODE
