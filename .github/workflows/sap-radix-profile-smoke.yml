name: SAP radix profile smoke

on:
  push:
    branches:
      - ci/sap-radix-profile-smoke-131

jobs:
  native-source-radix:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - name: Install native Vulkan build dependencies
        run: bash .github/scripts/install-vulkan.sh
      - name: Install DXC
        shell: bash
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/linux_dxc_2026_02_20.x86_64.tar.gz" \
            -o "${RUNNER_TEMP}/linux-dxc.tar.gz"
          mkdir -p "${RUNNER_TEMP}/dxc"
          tar -xzf "${RUNNER_TEMP}/linux-dxc.tar.gz" -C "${RUNNER_TEMP}/dxc"
          echo "${RUNNER_TEMP}/dxc/bin" >> "${GITHUB_PATH}"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/dxc/lib" >> "${GITHUB_ENV}"
      - name: Configure native source GPU testing
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFYZZXYZZY_BUILD_GODOT=OFF -DFYZZXYZZY_BUILD_VULKAN=ON -DFYZZXYZZY_BUILD_PHYSX_GPU_AABB_TEST=ON -DFYZZXYZZY_ENABLE_GPU_PHYSICS_PROTOTYPES=ON
      - name: Build source radix profiling executable
        run: cmake --build build --target fyzzxyzzy_physx_source_sap_radix_native --parallel 4
      - name: Run source GPU radix conformance
        run: ctest --test-dir build -R fyzzxyzzy_physx_source_sap_radix_native --output-on-failure
      - name: Compare original and batch-allocated native Vulkan descriptor recording
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          # The previous version of the one changed compute recorder is
          # the parent's blob; no second implementation is maintained.
          recorder_change="$(git log -1 --format=%H -- src/compute_vulkan.cpp)"
          for pass in 1 2; do
            git show "${recorder_change}^:src/compute_vulkan.cpp" > src/compute_vulkan.cpp
            echo "===== reference Vulkan recording / pass ${pass} ====="
            cmake --build build --target fyzzxyzzy_source_sap_radix_profile_vulkan --parallel 4
            git restore -- src/compute_vulkan.cpp
            echo "===== batch-allocated Vulkan recording / pass ${pass} ====="
            cmake --build build --target fyzzxyzzy_source_sap_radix_profile_vulkan --parallel 4
          done
