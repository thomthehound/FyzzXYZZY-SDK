name: SDK architecture contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - main
      - integration/n2-native-sc-gpu-report-admission
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture-review:
    name: Architecture ownership and runtime review
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Validate review gate and its unit tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_architecture_review.py'
          python3 scripts/check_architecture_review.py
          python3 scripts/check_native_boundary.py
